name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Release runs it first.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: composer lint
      - run: test/wordpress.sh
      - run: composer stan -- --no-progress
      - run: node --check trakk/settings.js
      - run: shellcheck test/*.sh
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - run: test/version.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Syntax
        run: find trakk -name "*.php" -print0 | xargs -0 -n1 php -d error_reporting=-1 -d display_errors=1 -l
      - run: composer test

  # mod_php and FPM, the oldest WordPress the plugin claims and the current one; Plugin Check on the current one.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        wordpress: ["6.5-php8.1", "7.1-php8.3"]
    steps:
      - uses: actions/checkout@v7
      - run: test/e2e.sh
        env:
          E2E_WORDPRESS: ${{ matrix.wordpress }}
