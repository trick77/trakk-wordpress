# The whole chain (e2e.sh): WordPress on mod_php and on FPM, Trakk, and a stub in Trakk's place that keeps every batch
# and fails on request. No port is published: the driver runs on the same network.
name: trakk-wordpress-e2e

x-wordpress: &wordpress
  environment: &env
    WORDPRESS_DB_HOST: db
    WORDPRESS_DB_USER: wp
    WORDPRESS_DB_PASSWORD: wp
    WORDPRESS_DB_NAME: wp
    WORDPRESS_DEBUG: "1"
    WORDPRESS_CONFIG_EXTRA: |
      define('WP_DEBUG_DISPLAY', false);
      define('WP_DEBUG_LOG', '/tmp/debug.log');
      define('WP_ENVIRONMENT_TYPE', 'local');
      define('AUTOMATIC_UPDATER_DISABLED', true);
      define('DISALLOW_FILE_EDIT', true);
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:13.0
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  apache:
    <<: *wordpress
    image: wordpress:${E2E_WORDPRESS:-7.1-php8.3}-apache
    environment:
      <<: *env
      WORDPRESS_TABLE_PREFIX: ap_
    volumes:
      - ./data/apache:/var/www/html
      - ../trakk:/var/www/html/wp-content/plugins/trakk:ro
      - ./mu.php:/var/www/html/wp-content/mu-plugins/mu.php:ro
    networks:
      default:
        aliases: [apache.wp.test]

  fpm:
    <<: *wordpress
    image: wordpress:${E2E_WORDPRESS:-7.1-php8.3}-fpm
    environment:
      <<: *env
      WORDPRESS_TABLE_PREFIX: fp_
    volumes: &fpm
      - ./data/fpm:/var/www/html
      - ../trakk:/var/www/html/wp-content/plugins/trakk:ro
      - ./mu.php:/var/www/html/wp-content/mu-plugins/mu.php:ro

  nginx:
    image: nginx:1.30-alpine
    depends_on: [fpm]
    volumes:
      - ./data/fpm:/var/www/html:ro
      - ../trakk:/var/www/html/wp-content/plugins/trakk:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases: [fpm.wp.test]

  trakk:
    image: ghcr.io/trick77/trakk:latest
    platform: linux/amd64
    user: "65532:65532"
    environment:
      BACKEND_DATA_DIR: /data
      BACKEND_SITES_FILE: /sites.json
      BACKEND_AUTH_DISABLED: "true"
      BACKEND_REFDATA_DISABLED: "true"
      BACKEND_TRUSTED_HOPS: "0"
    tmpfs: ["/data:uid=65532,gid=65532"]
    volumes:
      - ./sites.json:/sites.json:ro
    networks:
      default:
        aliases: [trakk.test]

  stub:
    image: php:8.6-cli-alpine
    command: [php, -S, "0.0.0.0:8080", /stub.php]
    environment:
      PHP_CLI_SERVER_WORKERS: "8"
    volumes:
      - ./stub.php:/stub.php:ro
    networks:
      default:
        aliases: [stub.test]

  cli-apache:
    <<: *wordpress
    image: wordpress:cli-2.12-php8.3
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *env
      WORDPRESS_TABLE_PREFIX: ap_
    volumes:
      - ./data/apache:/var/www/html
      - ../trakk:/var/www/html/wp-content/plugins/trakk:ro
      - ./mu.php:/var/www/html/wp-content/mu-plugins/mu.php:ro

  cli-fpm:
    <<: *wordpress
    image: wordpress:cli-2.12-php8.3
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *env
      WORDPRESS_TABLE_PREFIX: fp_
    volumes: *fpm

  driver:
    image: php:8.6-cli-alpine
    profiles: [tools]
    volumes:
      - ..:/src:ro
    working_dir: /src
